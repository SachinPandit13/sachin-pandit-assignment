<div class="container mt-4">
  <button class="btn btn-secondary mb-3" (click)="back()">
    ← Back
  </button>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading applications...</p>
  </div>

  <div *ngIf="!loading && applications.length > 0">
    <div class="table-responsive">
      <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th scope="col">Aadhar Number</th>
            <th scope="col">Income (₹)</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of applications">
            <td>{{ app.aadharNumber }}</td>
            <td>{{ app.income }}</td>
            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': app.status === 'Approved',
                      'bg-warning text-dark': app.status === 'Pending',
                      'bg-danger': app.status === 'Rejected'
                    }">
                {{ app.status }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="!loading && applications.length === 0" class="alert alert-info text-center">
    No applications found.
  </div>
</div>
