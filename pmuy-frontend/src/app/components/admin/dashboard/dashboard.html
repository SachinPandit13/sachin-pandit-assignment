<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-12 text-center mb-4">
      <h2>Welcome, Admin </h2>
      <p class="text-muted">Manage PMUY applications from your dashboard</p>
    </div>

    <div class="col-md-5 mb-3">
      <div class="card shadow-lg p-4 text-center h-100 rounded-4">
        <h4 class="mb-3"> List All Applications</h4>
        <button class="btn btn-outline-primary w-100" (click)="goToApplications()">
          View Applications
        </button>
      </div>
    </div>

    <div class="col-md-5 mb-3">
      <div class="card shadow-lg p-4 text-center h-100 rounded-4">
        <h4 class="mb-3">Verify & Approve</h4>
        <button class="btn btn-outline-success w-100" (click)="goToVerification()">
          Start Verification
        </button>
      </div>
    </div>
  </div>
</div>
